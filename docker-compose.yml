version: "3.9"
services:
  postgres:
    image: postgres:15
    container_name: al-mizan-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: audit_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - al-mizan-network

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/audit_db
      RABBITMQ_URL: amqp://guest:guest@al-mizan-rabbitmq:5672
      PORT: 3009
      NODE_ENV: production
    ports:
      - "3009:3009"
    depends_on:
      - postgres
    networks:
      - al-mizan-network

volumes:
  postgres_data:

networks:
  al-mizan-network:
    external: true
